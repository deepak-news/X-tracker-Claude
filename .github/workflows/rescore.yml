name: Rescore website items (one-off)

# The general desk's score again for the website's recent items (tracker/rescore.py). Writes
# a file only; nothing is sent to the website or by email.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Source keys, comma separated (grp|source)"
        default: ""
      ids:
        description: "Or gazette ids to read again and judge by both desks (comma separated)"
        default: ""
      hours:
        description: "How many hours back"
        default: "24"
      x:
        description: "X posts cut off: read whole and judge again (yes or empty)"
        default: ""
      compare:
        description: "X post ids to judge three ways, three times each (comma separated)"
        default: ""
      try_sites:
        description: "Website sources to read once and print, nothing sent (names under site: more:, comma separated)"
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  rescore:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: inputs.try_sites != ''
        timeout-minutes: 10
        env:
          TRY_SITES: ${{ inputs.try_sites }}
        run: python -m tracker.site_sources --try "$TRY_SITES"
      - if: inputs.try_sites == ''
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESCORE_SOURCES: ${{ inputs.sources }}
          RESCORE_HOURS: ${{ inputs.hours }}
          RESCORE_IDS: ${{ inputs.ids }}
          RESCORE_X: ${{ inputs.x }}
          RESCORE_COMPARE: ${{ inputs.compare }}
        run: python -m tracker.rescore
      - if: inputs.try_sites == ''
        uses: actions/upload-artifact@v4
        with:
          name: rescore
          path: rescore.json
          retention-days: 3
