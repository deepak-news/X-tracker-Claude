name: News Tracker

# Timing comes from cron-job.org, which posts to the dispatch endpoint every
# 15 minutes. GitHub's own schedule used to be listed here as a fallback, but
# it delivers only a small fraction of its runs AND occasionally fires at the
# same moment as the external timer -- two runs then read the same state,
# scored the same stories and each sent its own email. A fallback that
# duplicates alerts is worse than no fallback.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this run do?"
        type: choice
        default: normal
        options:
          - normal
          - test-email
          - dry-run

# Never let two runs overlap -- they would fight over state.json.
concurrency:
  group: news-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The latest main, not the commit from when this run was queued. A
      # run that waits behind a slow one would otherwise start from memory
      # saved BEFORE the slow run finished -- and re-send whatever it sent
      # (the 3 PM digest went twice on 22 Sep this way).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the news sources and send any alerts
        # A hang here (a slow source, an AI request that never returns)
        # would otherwise block every run behind it for hours, since two
        # runs are never allowed to overlap -- see the concurrency block
        # above. This kills a stuck run well before the next one is due.
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ADMIN_MAIL_TO: ${{ secrets.ADMIN_MAIL_TO }}
        run: |
          case "${{ inputs.mode }}" in
            test-email) python -m tracker.main --test-email ;;
            dry-run)    python -m tracker.main --dry-run ;;
            *)          python -m tracker.main ;;
          esac

      # Its own step, so a government site being down cannot stop the news
      # alerts, and a bad day for the AI cannot stop the government alerts.
      # always() runs it even when the step above failed.
      - name: Check the watched government pages
        # Longer than the program's own four-minute budget on purpose: the
        # program should be the one to stop, having sent and saved what it
        # had. GitHub killing the step is the case where progress is lost.
        if: always() && inputs.mode != 'test-email'
        timeout-minutes: 8
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_MAIL_TO: ${{ secrets.WATCH_MAIL_TO }}
          MAIL_TO: ${{ secrets.MAIL_TO }}          # MeitY gazettes go to the Tech Desk
          GAZETTE_MAIL_TO: ${{ secrets.GAZETTE_MAIL_TO }}
          MHA_FINANCE_MAIL_TO: ${{ secrets.MHA_FINANCE_MAIL_TO }}   # Abhishek's MHA and Finance gazettes
          # Every reporter's own gazette list, one line per desk.
          GAZETTE_DESKS: ${{ secrets.GAZETTE_DESKS }}
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            python -m tracker.watch --dry-run
          else
            python -m tracker.watch
          fi

      # The third prong: official news with broad public value, for the head
      # of social media. Its own step, so a problem here cannot stop either
      # of the other two, and theirs cannot stop this. It does nothing until
      # the SOCIAL_MAIL_TO secret exists.
      - name: Check official news for the national desk
        if: always()
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SOCIAL_MAIL_TO: ${{ secrets.SOCIAL_MAIL_TO }}
        run: |
          case "${{ inputs.mode }}" in
            test-email) python -m tracker.national --test-email ;;
            dry-run)    python -m tracker.national --dry-run ;;
            *)          python -m tracker.national ;;
          esac

      # Once a day, on the first run after 7 pm India time: every committee
      # meeting in both Houses for the week ahead (parliament_week.py). Every
      # other run it only looks at the clock and stops. Does nothing until
      # the PARLIAMENT_WEEK_TO secret exists.
      - name: Send the week-ahead Parliament committee meetings
        if: always() && inputs.mode != 'test-email'
        timeout-minutes: 4
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PARLIAMENT_WEEK_TO: ${{ secrets.PARLIAMENT_WEEK_TO }}
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            python -m tracker.parliament_week --dry-run
          else
            python -m tracker.parliament_week
          fi

      - name: Remember what we have already seen
        if: always()
        run: |
          git config user.name "news-tracker"
          git config user.email "actions@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/mine.json"
          # The email counter keeps its own file (see email_out.py for why).
          cp mail_log.json "$RUNNER_TEMP/mine_log.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/mine_log.json"
          # A week of the AI's judgements, for improving the rubric (score_log.py).
          cp scores.json "$RUNNER_TEMP/mine_scores.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/mine_scores.json"

          # Nothing in state.json genuinely conflicts -- every field only
          # moves forward -- so it is combined by meaning rather than merged
          # as text. Rebasing it used to fail the whole run on a clash, which
          # threw away that run's progress and made it re-send everything.
          #
          # Every command that talks to GitHub is guarded. A step here runs
          # under "bash -e", so an unguarded failure kills the whole step on
          # the spot -- which is exactly how a single HTTP 504 from GitHub
          # once defeated this retry loop on its first pass.
          for attempt in 1 2 3 4 5; do
            [ "$attempt" -gt 1 ] && sleep $(( (attempt - 1) * 15 ))

            git fetch origin main || { echo "fetch failed (attempt $attempt)"; continue; }
            git checkout -- state.json mail_log.json scores.json 2>/dev/null || true
            rm -f mail_log.json scores.json
            git reset --hard origin/main --quiet || { echo "reset failed (attempt $attempt)"; continue; }

            python -m tracker.merge_state "$RUNNER_TEMP/mine.json" state.json > "$RUNNER_TEMP/merged.json"
            mv "$RUNNER_TEMP/merged.json" state.json
            [ -f mail_log.json ] || echo '{}' > mail_log.json
            python -m tracker.merge_state --mail-log "$RUNNER_TEMP/mine_log.json" mail_log.json > "$RUNNER_TEMP/merged_log.json"
            mv "$RUNNER_TEMP/merged_log.json" mail_log.json
            [ -f scores.json ] || echo '[]' > scores.json
            python -m tracker.score_log "$RUNNER_TEMP/mine_scores.json" scores.json "$RUNNER_TEMP/merged_scores.json"
            mv "$RUNNER_TEMP/merged_scores.json" scores.json
            git add state.json mail_log.json scores.json
            git diff --staged --quiet && { echo "nothing new to record"; exit 0; }

            git commit -m "seen up to $(date -u +%FT%TZ)" --quiet || { echo "commit failed (attempt $attempt)"; continue; }
            if git push --quiet; then echo "progress saved"; exit 0; fi
            echo "push did not land (attempt $attempt), merging again"
          done

          # Losing this is a nuisance, not a disaster. Nothing is corrupted:
          # the next run merges the same progress and pushes it. The one real
          # cost is that an alert already sent may be sent a second time.
          #
          # That is not worth a red run and an email from GitHub about an
          # outage at GitHub, which is why this ends green and says so here
          # instead. If you get the same alert twice, this is why.
          echo "COULD NOT SAVE PROGRESS after 5 attempts -- GitHub was unreachable."
          echo "The next run will push it instead. An alert may repeat once."
          exit 0
