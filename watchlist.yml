# ============================================================
#  THE ONLY FILE YOU EVER NEED TO EDIT
#  Add or remove accounts, or change what counts as news,
#  without touching a single line of code.
# ============================================================

# --- The names people see on each kind of email ---------------
# Shown as the sender and at the top of the email. The emails still come from
# the same Gmail address; only the name changes. Recipients are blind-copied,
# so nobody sees anyone else's address.
mail_names:
  tech_desk: "For Tech Desk"                  # IT-beat alerts and the hourly digest (MAIL_TO)
  government_watch: "DoPT, MHA & ED Watch"    # DoPT orders, MHA gazettes, ED pages (WATCH_MAIL_TO)
  national_desk: "Alerts for Tweets"          # screened official news (SOCIAL_MAIL_TO)
  maintenance: "Tracker Maintenance"          # "tracker stopped", watchdog (ADMIN_MAIL_TO, else MAIL_TO)
  # The five-ministry gazette watch sets its own name further down ("mail_name").

# --- Staying inside Gmail's daily sending limit --------------
# Gmail lets one account reach about 500 recipients in any rolling 24 hours;
# an email to four people counts as four. Every email sent is counted.
#   past warn_at   -> you are emailed once, and Tech Desk and Tweets carry only
#                     MAJOR items (9-10/10); the hourly digest waits
#   past daily_limit minus keep_free -> everything but maintenance mail is
#                     held and sent later, once there is room
# keep_free covers what the counter cannot see: the DoPT check on the Mac,
# which sends from the same account, and any test emails.
mail_budget:
  daily_limit: 500
  warn_at: 400
  keep_free: 30

# --- What counts as newsworthy -------------------------------
# This is the instruction the AI reads every time it judges a post.
# Edit it freely; it is plain English on purpose.
newsworthy: |
  A reporter on the IT beat for PTI, India's national news wire. Covers IT
  services, artificial intelligence, semiconductors and startups.

  FILE AN ALERT FOR:
  - Acquisitions, mergers, stake sales, IPO filings and listings.
  An acquisition, investment or stake purchase by a watched company
  counts even when the amount is not disclosed -- the deal is the story,
  not the number.
  - Funding rounds, big investments, new fabs, factories or capex commitments
  - Deals, contracts and partnerships between companies, or with governments
  - Leadership changes: appointments, exits, resignations, board changes
  - Layoffs, hiring commitments, large restructuring
  - Government and regulatory moves on IT, AI, semiconductors, data or telecom
  - Major product, chip or AI model launches with real substance
  - Quarterly results, revenue or headcount numbers
  - Company blogs and research reports that disclose something new: survey
    or study findings with hard numbers (especially about India), market
    size or share estimates from a named firm, a new India investment,
    customer, hire count or facility, or a model/product with real specifics
  - Disclosures by the major AI companies -- OpenAI, Anthropic, Google
    DeepMind, Meta, xAI, Microsoft, Mistral, NVIDIA and the like -- EVEN WITH
    NO INDIA ANGLE: safety, misalignment or incident reports; threat
    intelligence reports on misuse of AI (state-backed hackers, scams,
    influence operations, cyberattacks); significant research findings; and
    new policies, frameworks or commitments governing their models.
    These are wire stories in their own right; score them 7 or higher.
  - Statements by a founder, CEO or minister that are themselves the story,
    especially on industry direction, policy, competition or controversy
  - REGULATOR DOCUMENTS (CCI, CERT-In, DGFT) -- the order or notice itself,
    usually before anyone has reported it:
    CCI: any antitrust order involving a tech, telecom, internet, e-commerce,
    fintech, gaming, electronics or chip company (Google, Apple, Meta,
    Amazon, Flipkart, Swiggy, Zomato, Intel, HP and the like) -- an
    investigation ordered, a penalty, an interim order, a settlement; and
    merger approvals where either side is in those sectors. Score 7+.
    Ignore CCI orders and mergers in unrelated industries (cement, coal,
    fertilisers, liquor, trucking) and complaints closed against small firms.
    CERT-In: advisories about attacks on India, critical infrastructure,
    government systems, banks or payments, or a flaw being actively
    exploited, score 7+. Routine "multiple vulnerabilities in <vendor>
    products" patch roundups score 4 at most.
    DGFT: import or export curbs, bans, licensing or duty changes touching
    electronics, laptops, phones, chips, telecom gear, solar or IT hardware
    score 7+. Farm goods, textiles, procedural timelines and form changes
    score 4 at most.

  IGNORE:
  - Opinions, hot takes, threads of advice, motivational posts
  - Memes, jokes, banter, replies to other people
  - Congratulations, condolences, festival greetings, birthday wishes
  - Marketing posts, webinar and event promotion, hiring-we-are-hiring posts
  - How-to guides, product tips, customer case studies, and thought-leadership
    essays that contain no new fact or figure
  - Routine international product updates with no India angle
  - Anything already widely reported days ago

  INDIA IS THE PRIORITY. Indian companies, Indian executives, Indian policy
  and India operations of global firms matter most. Big global news still
  counts, but routine international developments do not.

# --- How picky to be -----------------------------------------
# The AI scores each post 0-10. Only posts at or above this get emailed.
# Start at 7. If your inbox is noisy raise it to 8; if you feel you are
# missing things drop it to 6.
threshold: 7

# --- Google News stories arrive as an hourly digest -----------
# News reports are collected and emailed together just after every hour,
# Indian time (2:00, 3:00, 4:00...), so you know when to look. An hour with
# nothing in it sends nothing. Exchange filings, company newsrooms and PIB
# releases are NEVER held -- they still arrive the moment they are found.
# Set to false to send news reports straight away again.
news_digest_hourly: true

# --- Cheap filters applied BEFORE the AI even looks ----------
skip_replies: true       # ignore replies to other people
skip_retweets: true      # ignore reposts
min_length: 25           # ignore posts shorter than this many characters

# Never alert on anything older than this many hours, even if the tracker
# is only seeing it now. Stops old posts arriving after an outage or a slow
# rotation. Raise it if you would rather catch up than miss things.
max_age_hours: 6

# --- Technical dials (you can leave these alone) -------------
timeline_limit: 150      # how many posts to pull from the Following feed
sweep_size: 8            # safety-net rotation over accounts the list already covers
per_account_limit: 10    # posts pulled per account during that sweep


# --- Priority accounts ---------------------------------------
# Accounts checked DIRECTLY every run, bypassing the X list.
# Empty on purpose: every watched account is currently in the list, so
# nothing needs the expensive direct treatment. Add a handle here only if
# it is NOT in the X list and you cannot wait ~100 min for the rotation.
priority: []

