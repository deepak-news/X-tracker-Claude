# ======================================================================
#  GOVERNMENT WATCH
#  A separate job with a separate recipient list (WATCH_MAIL_TO).
#  Nothing here is scored or filtered: every new row, and every change,
#  is emailed. No AI request is made for any of it.
# ======================================================================
watch:

  # Pages that GAIN ROWS. Each row is remembered by its own identifier,
  # so an order that sits on the page all week is reported once.
  uploads:

    # ---------------------------------------------------------------
    #  DoPT EO DIVISION ORDERS
    #  Read only from the Mac. DoPT accepts a home broadband line and
    #  refuses every hosting network in every country, so GitHub can
    #  never see these -- "home_only: true" is what stops it trying.
    #
    #  Just these two, on purpose: the wider 30-day reports were tried
    #  and dropped because they filled the mail with routine orders.
    #  An order is remembered by its order number and date, so the same
    #  order appearing on both pages is still emailed once.
    #
    #  If the Mac is off for more than a week, orders from the days it
    #  missed will have left "this week" and will not be emailed.
    # ---------------------------------------------------------------
    - name: DoPT EO - today's orders
      url: "https://doptcirculars.nic.in/EODivisionReport.aspx?Report=1"
      home_only: true

    - name: DoPT EO - this week's orders
      url: "https://doptcirculars.nic.in/EODivisionReport.aspx?Report=2"
      home_only: true

    # e-Gazette Category 6 is "Extra Ordinary", and lists every ministry
    # together, so it is filtered down to one. The text below need only be
    # part of the ministry name as the gazette prints it.
    # No "home_only", so GitHub reads this one around the clock.
    - name: e-Gazette - MHA extraordinary
      category: 6
      ministry: "Home Affairs"

    # The same gazette list, read in the same check, for a second person.
    # "mail_to" names the GitHub secret holding their address; this watch
    # stays switched off until that secret exists. Its first run only notes
    # what is already listed.
    - name: e-Gazette - Home, Finance, Defence, Law, I&B
      label: "Gazette of India"      # what the email shows beside each item
      category: 6
      ministries:
        - "Ministry of Home Affairs"
        - "Ministry of Finance"
        - "Ministry of Defence"
        - "Ministry of Law"                        # covers "Law and Justice"
        - "Ministry of Information and Broadcasting"
      mail_to: GAZETTE_MAIL_TO
      mail_name: "Gazette Alerts"

    # ---------------------------------------------------------------
    #  REPORTERS' OWN GAZETTE ALERTS
    #  One block per reporter (or per group of reporters who want the
    #  same ministries). All of them share the one gazette read above,
    #  so adding more costs no extra visits to the gazette site.
    #
    #  Addresses are NOT written here -- this file is public. They go in
    #  the GitHub secret GAZETTE_DESKS, one line per desk:
    #      law: reporter@pti.in, deepak@gmail.com
    #  and "mail_to" below points at that line: GAZETTE_DESKS:law
    #
    #  To add a reporter: copy the example, remove the # at the start of
    #  each line, change the name, ministries and desk label, then add the
    #  matching line to GAZETTE_DESKS. The first run only notes what is
    #  already listed; alerts start from the next gazette.
    # ---------------------------------------------------------------
    - name: e-Gazette - Law ministry
      category: 6
      ministries:
        - "Ministry of Law"                        # covers "Law and Justice"
      mail_to: GAZETTE_DESKS:law
      mail_name: "Law Ministry Gazettes"

    # Abhishek Shukla: Home Affairs and Finance. His address is in its own
    # GitHub secret, MHA_FINANCE_MAIL_TO.
    - name: e-Gazette - MHA and Finance
      label: "Gazette of India"
      category: 6
      ministries:
        - "Ministry of Home Affairs"
        - "Ministry of Finance"
      mail_to: MHA_FINANCE_MAIL_TO
      mail_name: "MHA & Finance Gazettes"

    # ---------------------------------------------------------------
    #  CBI FIRs -- every FIR the CBI registers, as it is published.
    #  Read only from the Mac, like DoPT: the CBI site refuses GitHub.
    #  The addresses are in ~/.watch-env on the Mac, as CBI_MAIL_TO.
    # ---------------------------------------------------------------
    - name: CBI FIRs
      url: "https://cbi.gov.in/view-fir"
      cbi: true
      home_only: true
      mail_to: CBI_MAIL_TO
      mail_name: "CBI FIRs"

    # MeitY gazettes, straight to the Tech Desk inbox (MAIL_TO) under the
    # Tech Desk's own name. Every one is sent -- no AI in between -- since
    # there are only a handful a month.
    - name: e-Gazette - MeitY
      category: 6
      ministries:
        - "Ministry of Electronics and Information Technology"
      mail_to: MAIL_TO
      mail_name: "For Tech Desk"

    # ---------------------------------------------------------------
    #  PARLIAMENT -- sansad.in, both Houses
    #  One watch, nineteen lists. Questions and answers are deliberately
    #  left out; they run into thousands per session.
    #
    #  What arrives, and when:
    #    all year    bills introduced, passed or assented; committee
    #                meetings called; committee reports presented;
    #                press releases from both Secretariats and from the
    #                Rajya Sabha's committees; Rajya Sabha notices
    #    in session  the List of Business (the agenda), Bulletin Part I
    #                and Part II, the Synopsis of the debate, and the
    #                papers laid on the Table -- for each sitting day of
    #                each House. Out of session these cost nothing: the
    #                sitting calendar is read first and nothing is asked
    #                for on a day neither House sat.
    #
    #  Sent to the same people as the five-ministry gazette watch
    #  (GAZETTE_MAIL_TO), in the same "Gazette Alerts" email.
    # ---------------------------------------------------------------
    - name: Parliament
      sansad: true
      mail_to: GAZETTE_MAIL_TO       # Achinta and Deepak, in the Gazette Alerts email

      # Nothing older than this is ever reported. The committee reports
      # list is not sorted by date, so this window is what separates this
      # month's reports from the four thousand already presented -- and it
      # is also what keeps the record of what has been sent small enough
      # to stay reliable. Raise it if a report ever arrives late.
      max_age_days: 30

      # The big lists -- every committee report ever presented, three
      # megabytes for the Rajya Sabha -- are read on this slower clock
      # instead of every fifteen minutes. A report is news for days, so
      # two hours costs nothing and spares the government's server.
      slow_minutes: 120

      # How often to re-read which days each House sits. It changes when a
      # session is summoned or extended, a few times a year.
      calendar_minutes: 360

      # Remove a line to switch that part off. Leave the list out
      # altogether and everything is read.
      streams:
        - bills                # bills introduced, passed, assented
        - ls_meetings          # Lok Sabha committee meetings called
        - rs_meetings          # Rajya Sabha committee meetings called
        - ls_press             # Lok Sabha Secretariat press releases
        - ls_reports           # Lok Sabha committee reports presented
        - rs_reports           # Rajya Sabha committee reports presented
        - rs_press             # Rajya Sabha Secretariat press releases
        - rs_committee_press   # Rajya Sabha committees' press releases
        - rs_updates           # Rajya Sabha notices (tenders excluded)
        - day_papers           # agenda, bulletins, synopsis -- per sitting
        - papers               # papers laid, one item per sitting day

  # Pages expected to stay IDENTICAL for weeks. Their content is
  # fingerprinted; when it moves, the lines that changed are emailed.
  pages:
    every_minutes: 120     # these change about monthly; hourly is plenty
    urls:
      - name: ED - restitution of properties and assets
        url: "https://www.enforcementdirectorate.gov.in/performance/restitution-of-properties-assets/"

      - name: ED - statistics
        url: "https://www.enforcementdirectorate.gov.in/performance/statistics/"

      - name: ED - performance summary
        url: "https://www.enforcementdirectorate.gov.in/performance/performance-summary/"


# ======================================================================
#  NATIONAL DESK
#  A third, separate job for the head of social media (SOCIAL_MAIL_TO).
#  It reads every official release -- all of PIB, the whole extraordinary
#  Gazette, the RBI, SEBI -- and the AI emails only what a general
#  audience would care about. Official sources only; no Google News.
# ======================================================================
national:

  # What the AI is looking for. Plain English; edit freely.
  newsworthy: |
    News a broad Indian audience would want to know, suitable for a
    national news agency's social media accounts.

    SEND:
    - Cabinet decisions and new or changed government schemes
    - Rules, prices, taxes, fees, benefits, deadlines or rights that
      touch large numbers of ordinary people
    - Major appointments, removals and resignations: ministers,
      governors, chiefs of the armed forces, heads of the RBI, CBI, ED,
      Election Commission, and similar posts
    - National security, terrorism, bans and designations, and major
      diplomatic moves
    - RBI decisions on interest rates, banks, UPI or money that people
      use; SEBI actions that affect ordinary investors
    - Elections, disasters, major accidents, and official responses to them
    - Landmark numbers: GDP, inflation, record achievements, milestones
    - Changes to the machinery of government that a wire agency reports as
      a matter of record: a commission, authority, board, regulator,
      mission or department set up, dissolved, merged, renamed or given new
      powers, and major policy resolutions of the central government --
      even when the sector itself is specialised
    - OFFICIAL FIGURES the government itself puts out, even when they are
      routine and periodic, and even when the release is titled as a dry
      update: direct tax and advance tax collections, GST collections,
      customs and excise revenue, GDP growth, CPI or WPI inflation,
      industrial production, exports and imports, the fiscal deficit,
      unemployment, foreign exchange reserves, bank credit, coal, power,
      steel and auto output, railway earnings and passenger numbers.
      These are wire copy on the day they appear: score them 8 or higher.
      The figures usually come from the Finance Ministry, CBDT, CBIC,
      MoSPI, the Commerce Ministry or the RBI
    - SEVERE weather only: red alerts, cyclones, cloudbursts, extreme
      heatwaves, monsoon onset or withdrawal, and seasonal outlooks. NOT the
      routine daily "heavy rainfall likely" bulletins IMD issues most days
      in the monsoon -- those score 4 at most
    - Exam results and dates for national exams
    - Arrests or cases involving senior officials, politicians or large
      sums; big corruption and fraud actions
    - State government decisions that touch a large population or carry
      national political weight -- a state cabinet's major scheme, not a
      district review meeting

    GAZETTE NOTIFICATIONS: judge by what the notification DOES, which the
    text below the title shows. Titles are often dry ("Amendment of
    notification dated 7 January") while the change is real news. SEND a
    gazette that:
    - changes the census, elections, delimitation, the NPR or voter rolls,
      even if only for a few districts or one state
    - brings an Act or major new rules into force, or sets a date by which
      people must do something
    - bans or designates an organisation or person as terrorist or
      unlawful; imposes, extends or lifts AFSPA, "disturbed area" status
      or President's Rule
    - appoints or removes heads or members of constitutional and
      regulatory bodies (Election Commission, CAG, UPSC, RBI, SEBI, TRAI),
      or judges of the Supreme Court and High Courts
    - changes taxes, duties or prices that ordinary people pay
    - issues a commemorative coin or stamp, or marks an anniversary of a
      monument, institution or national event
    - sets up, dissolves, merges or restructures a government commission,
      authority, board, regulator or department, or is a Cabinet or
      ministry RESOLUTION announcing a policy decision (for example, the
      September 2026 resolution dissolving the Digital Communications
      Commission) -- score these 7 or higher
    Gazettes that are routine and score 4 at most: fortnightly tariff
    values and exchange rates, highway land acquisition and toll notices,
    railway land and project notices, cantonment boards, honorary ranks,
    recruitment rules for a single post, one product's customs or excise
    amendment, standards (BIS) notices.

    REGULATOR DOCUMENTS (CCI, CERT-In, DGFT) -- SEND only the big ones:
    - a CCI penalty, investigation or interim order against a household
      name (Google, Apple, Amazon, Meta, Flipkart, Zomato, Swiggy, a large
      Indian conglomerate, a major bank), or approval of a very large or
      well-known merger
    - a CERT-In warning of an active attack on India, on government
      systems, banks, payments or critical infrastructure, or one telling
      the public to act (update a phone or browser now)
    - a DGFT ban, curb or duty on exports or imports that ordinary people
      notice -- wheat, rice, onions, sugar, gold, phones, laptops
    Everything else from these three -- routine merger approvals, orders
    against small firms, vendor patch roundups, procedural trade notices --
    scores 4 at most.

    LEAVE OUT:
    - Auctions, tenders, recovery orders and routine compliance notices
    - Meetings held, visits, events attended, speeches with no decision
    - Greetings, condolences, anniversaries, quotes and awareness drives
    - Transfers and postings below the most senior level
    - Anything that matters only to one industry or to specialists --
      except the central government decisions and changes to government
      bodies described above, which are news whatever the sector

  # Score out of 10 needed to be emailed. Raise to 8 if it sends too much,
  # drop to 6 if it misses things.
  threshold: 7

  # Anything published longer ago than this is ignored rather than judged.
  max_age_hours: 12

  pib: true         # every ministry, from pib.gov.in
  gazette: true     # every extraordinary gazette, from egazette.gov.in
  # CCI, CERT-In and DGFT -- the same documents the Tech Desk reads,
  # judged here by this desk's own rubric.
  regulators: [cci, certin, dgft]

  # --- Earthquakes -------------------------------------------------
  # Read from the National Centre for Seismology (riseq.seismo.gov.in) for
  # India and its neighbours -- Pakistan, Nepal, China and Tibet, Bhutan,
  # Bangladesh, Myanmar, Sri Lanka, Maldives and Afghanistan -- and from
  # the USGS for the rest of the world. These do NOT go past the AI: a
  # magnitude is a measurement, so anything at or above the numbers below
  # is emailed at once, even when the AI is out of quota.
  # A quake within India is news at a size that would pass unremarked
  # elsewhere, hence the separate figure. Set "earthquakes: false" to
  # switch the whole thing off.
  earthquakes:
    min_magnitude: 5.7            # anywhere in the world
    india_min_magnitude: 4.5      # inside India
    neighbour_min_magnitude: 4.5  # the neighbouring countries

  # Any other official site that publishes an RSS feed can be added here.
  feeds:
    - {name: RBI, url: "https://www.rbi.org.in/pressreleases_rss.xml"}
    - {name: RBI notifications, url: "https://www.rbi.org.in/notifications_rss.xml"}
    - {name: SEBI, url: "https://www.sebi.gov.in/sebirss.xml"}
    # Added 2026-09-17; none advertise their feed, each checked live.
    - {name: NITI Aayog, url: "https://www.niti.gov.in/rss.xml"}
    - {name: President of India, url: "https://www.presidentofindia.gov.in/rss.xml"}
    - {name: "State: Telangana", url: "https://www.telangana.gov.in/feed/"}

  # Official sites with no feed. The page is read and any release not there
  # last time is new, then opened and read in full (most are PDFs) before
  # the AI judges it. "match" says which links on the page are releases.
  # A site added here only notes what it already lists on its first run.
  # A site failing three runs running is skipped for six hours, then retried.
  # All checked against the live sites on 2026-09-17.
  pages:
    - {name: PMO, url: "https://www.pmindia.gov.in/en/news-updates/", match: "^/en/news_updates/[^/]+"}
    - {name: IMD, url: "https://internal.imd.gov.in/pages/press_release_mausam.php", match: "^/press_release/.+\\.pdf$", exclude: "[\\u0900-\\u097F]"}   # English copies only
    - {name: IRDAI, url: "https://irdai.gov.in/press-releases", match: "^/documents/37343/366347/"}
    - {name: MHA, url: "https://www.mha.gov.in/en/media/whats-new", match: "^/sites/default/files/.+\\.pdf$"}
    - {name: CBSE, url: "https://www.cbse.gov.in/cbsenew/cbse.html", match: "^/cbsenew/documents/.+\\.pdf$"}
    # UP types its cabinet decisions in the old Kruti Dev Hindi font; the PDF
    # text is converted back to real Hindi before the AI reads it.
    - {name: "State: Uttar Pradesh", url: "https://information.up.gov.in/hi_cabinet-decision-new.aspx", match: "\\.pdf$"}   # cabinet decisions, Hindi
