  # 2b. Company pages with NO feed at all. The page is read and any article
  #     link not there last time is treated as a new post, then opened and
  #     read in full before the AI judges it.
  #     "match" says which links on the page are articles (the part of the
  #     address after the site name). Leave it out and every link BELOW the
  #     page's own address counts -- e.g. anything under /news for /news.
  #     The first time a page is read, what is already there is only noted.
  #     Checked against the live sites on 2026-09-17.
  pages:
