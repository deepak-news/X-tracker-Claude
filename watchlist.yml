  # 2. Company newsrooms - the company speaking for itself.
  #    Only feeds that actually returned dated items are listed; the rest
  #    (Accenture, Adobe, Anthropic, Cognizant, Qualcomm, Uber, Telegram,
  #    Truecaller, X) publish no working RSS and are covered by news below.
